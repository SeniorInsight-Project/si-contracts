          type: [string, 'null']
        horario:
          $ref: '#/components/schemas/Horario'
        frequencia:
          type: string
        diasSemana:
          type: [string, 'null']
        dataInicio:
          type: [string, 'null']
          format: date
        dataFim:
          type: [string, 'null']
          format: date
        ativo:
          type: boolean
        observacoes:
          type: [string, 'null']
        statusHoje:
