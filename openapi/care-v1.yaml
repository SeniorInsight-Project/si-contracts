    DispararSosRequest:
      type: object
      description: Corpo opcional; o SOS pode ser disparado sem localização.
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: -23.55052
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -46.633308
        nivelBateria:
          type: integer
          minimum: 0
          maximum: 100
